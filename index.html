<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left-image">
        <div class="logo">
            <img src="img/odin-lined.png" alt="odin-png" height="120px" width="90px">
            <p>ODIN</p>
        </div>
    </div>

    <div class="form-section">
        <h1 class="long-text">This is not a real service! You know you need something like this in your
            life to help you realize your deepest dreams. <br> Sign up <i>now</i> to get started.
        </h1>
        <h1 class="slogan">You <i>know</i> you want to</h1>

        <form action="">

            <div class="enter-details">
                <h1>Let's do this</h1>
                <div class="name">
                    <p>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name" id="first-name">
                    </p>

                    <p>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name">
                    </p>
                </div>

                <div class="contacts">
                    <p>
                        <label for="email">EMAIL</label>
                        <input type="email" name="usr_email" id="email">
                    </p>

                    <p>
                        <label for="number">PHONE NUMBER</label>
                        <input type="text" name="usr_number" id="number">
                    </p>
                </div>

                <div class="secure-info">
                    <p>
                        <label for="password">PASSWORD</label>
                        <input type="password" name="usr_password" id="password" required>
                    </p>

                    <p>
                        <label for="conf-password">CONFIRM PASSWORD</label>
                        <input type="password" name="conf_usr_password" id="conf-password" required>
                    </p>
                </div>
            </div>

            <div class="bottom-section">
                <button type="submit">Create Account</button>
                <p class="log-in">Already have an account?<a href=""> Log In</a></p>
            </div>
        </form>
    </div>
</body>
</html>
